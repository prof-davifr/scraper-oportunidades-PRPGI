[project]
name = "scraper-oportunidades-PRPGI"
version = "0.5.0"
description = "Coletor de editais de fomento à pesquisa (CAPES, CNPq, FINEP, FAPESB, SETEC) com exportação CSV/Excel/HTML."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "PRPGI"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
scraper-oportunidades = "crawler.main:main"
gerador-editais-gui = "crawler.gui:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # allow assert in tests
    "RUF001", # en-dash em texto PT-BR é tipografia legítima (e regex de nº de edital usa – semanticamente)
    "RUF003", # idem em comentários
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"crawler/parsers/**" = ["E402"]  # bootstrap sys.path intencional (execução standalone)
"crawler/main.py" = ["E402"]     # idem
"crawler/database.py" = ["E501"]  # templates HTML longos (CSS/JS embutidos)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"